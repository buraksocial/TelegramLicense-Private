<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mağaza</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--surface:#111a2e;--card:#151f35;--line:#ffffff14;--chip:#1c2940;--txt:#f4f7fc;--mut:#9aa9bf;--acc:#7c8cff;--ok:#42d6a4;--warn:#f6b85f;--bad:#ff727e;--shadow:0 18px 50px #0005}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#25365c 0,transparent 48%),var(--bg);color:var(--txt);font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;letter-spacing:.01em}
header{position:sticky;top:0;background:#10182bed;backdrop-filter:blur(18px);display:flex;align-items:center;gap:12px;padding:14px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);z-index:5}
header .logo{font-weight:750;font-size:18px;letter-spacing:-.03em}header .sp{flex:1}.balance{background:#17243a;border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:13px}
nav.cats{display:flex;gap:9px;overflow-x:auto;padding:20px clamp(16px,4vw,48px) 6px;scrollbar-width:none}.chip{white-space:nowrap;background:#121c30;border:1px solid var(--line);color:#c5d0e2;padding:8px 15px;border-radius:999px;cursor:pointer;font-size:13.5px;transition:.18s}.chip:hover,.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:22px clamp(16px,4vw,48px) 90px;max-width:1320px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,255px),1fr));gap:16px;margin-top:8px}
.card{background:linear-gradient(145deg,#17233b,#121b2e);border-radius:18px;padding:20px;cursor:pointer;border:1px solid var(--line);box-shadow:0 8px 24px #0002;transition:transform .2s,border-color .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);border-color:#7c8cff88;box-shadow:var(--shadow)}.card h3{margin:0 0 12px;font-size:16px;font-weight:650;letter-spacing:-.015em}.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.price{color:#9cafff;font-weight:750;font-size:19px}.stock{color:var(--mut);font-size:12.5px}.badge{font-size:11px;padding:4px 9px;border-radius:999px;background:#ff727e18;color:var(--bad);border:1px solid #ff727e35}.badge.warr{background:#42d6a418;color:var(--ok);border-color:#42d6a435}
button{background:var(--acc);border:1px solid transparent;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;cursor:pointer;font-weight:650;transition:filter .15s,transform .15s}button:hover{filter:brightness(1.1);transform:translateY(-1px)}button.ghost{background:#1b2940;border-color:var(--line);color:#e5ebf5}button:disabled{opacity:.45;cursor:default;transform:none}.rowbtns{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.svc{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#121c30;padding:14px 16px;border-radius:14px;margin:9px 0;border:1px solid var(--line);cursor:pointer}.svc.sel{border-color:var(--acc);background:#7c8cff13}.svc.off{opacity:.5;cursor:default}.svc .n{font-size:14px}.svc .p{font-weight:700;color:#a5b5ff;text-align:right}.desc{background:#121c30;border:1px solid var(--line);border-radius:14px;padding:16px;white-space:pre-wrap;font-size:14px;color:#c8d2dc;margin:12px 0}
.modal{position:fixed;inset:0;background:#050914c9;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.modal.on{display:flex}.sheet{background:linear-gradient(145deg,#19243a,#121b2e);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:22px;max-width:480px;width:100%;max-height:86vh;overflow:auto}
input,select{background:#0e1729;border:1px solid #ffffff20;color:var(--txt);padding:12px 13px;border-radius:11px;font-size:15px;width:100%}input:focus,select:focus{outline:2px solid #7c8cff66;border-color:var(--acc)}label{display:block;font-size:12.5px;color:var(--mut);margin:11px 0 5px}.order{background:#121c30;border-radius:14px;padding:14px 16px;margin:9px 0;border:1px solid var(--line);font-size:13.5px}.order .hd{display:flex;justify-content:space-between;gap:10px}.order code{color:var(--ok);word-break:break-all;font-size:12px}.st{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--chip)}.st.ok{color:var(--ok)}.st.pend{color:var(--warn)}.muted{color:var(--mut);font-size:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17233b;color:#fff;padding:12px 20px;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;display:none;z-index:50;max-width:90vw}a{color:#a5b5ff}
.login-wrap{max-width:1080px;margin:clamp(28px,8vh,88px) auto;display:grid;grid-template-columns:1.1fr .9fr;overflow:hidden;border:1px solid var(--line);border-radius:26px;background:#121c30;box-shadow:var(--shadow);min-height:440px}.login-brand{padding:clamp(28px,5vw,58px);display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(ellipse at 15% 10%,#7c8cff45,transparent 50%),linear-gradient(145deg,#1b2944,#121b2e)}.login-brand h1{font-size:clamp(30px,4vw,48px);line-height:1.08;letter-spacing:-.05em;margin:0 0 16px}.login-brand p{max-width:440px;color:#b8c5d9;font-size:15px}.login-mark{font-size:13px;color:#b8c5d9}.login-panel{padding:clamp(26px,4vw,48px);display:flex;flex-direction:column;justify-content:center}.login-panel h2{font-size:23px;letter-spacing:-.03em;margin:0 0 6px}.login-panel .muted{margin:0 0 22px}.login-error{padding:12px 14px;border-radius:12px;background:#ffb85c12;border:1px solid #ffb85c33;color:#f6c779;margin:8px 0;font-size:13px}
@media(max-width:680px){header{padding:11px 14px;gap:7px}header .logo{font-size:16px}header button{padding:8px 10px;font-size:12px}nav.cats{padding:14px 14px 4px}main{padding:18px 14px 72px}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px;border-radius:15px}.card h3{font-size:14px}.price{font-size:17px}.login-wrap{grid-template-columns:1fr;margin:24px 14px;border-radius:20px}.login-brand{padding:25px;min-height:190px}.login-brand h1{font-size:32px}.login-panel{padding:25px}.sheet{padding:18px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">🛒 <span data-i="app_name">Mağaza</span></div>
  <div class="sp"></div>
  <div class="balance" id="balChip" style="display:none"></div>
  <button class="ghost" id="btnLang" style="padding:6px 10px;font-size:13px">EN/TR</button>
  <button class="ghost" id="btnDep" style="display:none;padding:6px 10px;font-size:13px">🌐 Yatır</button>
  <button class="ghost" id="btnOrders" style="padding:6px 10px;font-size:13px" data-i="nav_orders">Siparişlerim</button>
  <a href="/admin.html" id="btnAdmin" style="display:none"><button class="ghost" style="padding:6px 10px;font-size:13px">⚙️ Admin</button></a>
  <button class="ghost" id="btnOut" style="padding:6px 10px;font-size:13px;display:none" data-i="nav_logout">Çıkış</button>
</header>
<nav class="cats" id="cats"></nav>
<main id="view"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const state={token:localStorage.getItem('shop_token')||null,lang:localStorage.getItem('shop_lang')||'tr',
  products:[],categories:[],cat:null,product:null,decision:null,lock:null,me:null};
const I18N={
 tr:{app_name:'Mağaza',nav_orders:'Siparişlerim',nav_logout:'Çıkış',login_h:'Giriş yap',
  login_p:'Devam etmek için Telegram hesabınla giriş yap. Bakiyen, indirimlerin ve siparişlerin botla aynıdır.',
  login_retry:'🔄 Yenile',login_id:'Telegram ID',login_btn:'Giriş',err_login:'Giriş başarısız',choose_cat:'🗂 Kategori seç',all:'Tümü',
  sold_out:'🔴 tükendi',reserve:'⏳ Rezerve et',buy:'Satın al',qty:'Adet',pay:'Öde',total:'Toplam',
  pay_bal:'💳 Bakiye ile öde',pay_bn:'🟡 Binance (TXID)',back:'🔙 Geri',orders_t:'Siparişlerim',
  no_orders:'Henüz sipariş yok.',delivered:'Teslim edildi',pend:'Bekliyor',bal:'Bakiye',
  promo_h:'🎁 Promosyon Kodu',promo_ph:'KOD',promo_btn:'Kullan',
  caride_note:'Hesabın caride (negatif bakiye). Bakiye ile ödeme için önce yükleme yap.',
  buy_t:'Satın al',svc:'Hizmetler',best:'⭐ en iyi',stock:'stok',ok:'Sipariş tamam!',
  copied:'kopyalandı',insufficient:'bakiye yetersiz',lock_expired:'Fiyat süresi doldu, tekrar dene',
  queued_t:'🕐 Ödemen bekliyor',credited_t:'Bakiyene yüklendi',dep_t:'Kripto yatırma',dep_get:'Adresimi oluştur',dep_note:'Adres yalnızca sana özel — ödeme ağda doğrulanınca tutar otomatik bakiyene yazılır.'},
 en:{app_name:'Store',nav_orders:'My Orders',nav_logout:'Logout',login_h:'Sign in',
  login_p:'Sign in with your Telegram account to continue. Balance, discounts and orders are shared with the bot.',
  login_retry:'🔄 Reload',login_id:'Telegram ID',login_btn:'Sign in',err_login:'Login failed',choose_cat:'🗂 Choose category',all:'All',
  sold_out:'🔴 sold out',reserve:'⏳ Reserve',buy:'Buy',qty:'Quantity',pay:'Pay',total:'Total',
  pay_bal:'💳 Pay with balance',pay_bn:'🟡 Binance (TXID)',back:'🔙 Back',orders_t:'My orders',
  no_orders:'No orders yet.',delivered:'Delivered',pend:'Pending',bal:'Balance',
  promo_h:'🎁 Promo Code',promo_ph:'CODE',promo_btn:'Redeem',
  caride_note:'Account is in the red (negative). Top up before paying with balance.',
  buy_t:'Purchase',svc:'Services',best:'⭐ best',stock:'stock',ok:'Order complete!',
  copied:'copied',insufficient:'insufficient balance',lock_expired:'Price expired, try again',
  queued_t:'🕐 Payment pending',credited_t:'Credited to balance',dep_t:'Crypto deposit',dep_get:'Create my address',dep_note:'The address is personal to you — once the network confirms, the amount is credited to your balance automatically.'}};
const t=k=>(I18N[state.lang]||I18N.tr)[k]||k;

async function api(path,opts={}){
  opts.headers=Object.assign({'Content-Type':'application/json','x-lang':state.lang},opts.headers||{});
  if(state.token)opts.headers.Authorization='Bearer '+state.token;
  const r=await fetch('/api/'+path,opts);
  const j=await r.json().catch(()=>({error:'network'}));
  if(!r.ok){const e=new Error(j.error||('http '+r.status));e.status=r.status;e.code=j.code;throw e;}
  return j;
}
function toast(m){const el=$('#toast');el.textContent=m;el.style.display='block';setTimeout(()=>el.style.display='none',3200)}
function money(n){return Number(n||0).toFixed(2)+'$'}
function setBal(v){const c=$('#balChip');if(!c)return;c.textContent=t('bal')+': '+money(v);c.style.color=v<0?'#e5484d':''}

async function loadShell(){
  state.crypto=false;
  try{const cfg=await api('config');state.categories=cfg.categories||[];state.botUsername=cfg.bot_username||null;state.crypto=!!cfg.crypto_deposits;}catch(e){}
  if(!state.token){renderLogin();return}
  try{state.me=await api('me');}catch(e){if(e.status===401){state.token=null;localStorage.removeItem('shop_token');renderLogin();return}}
  $('#balChip').style.display='block';setBal(state.me.balance);
  $('#btnOut').style.display='inline-block';
  if(state.me.is_admin)$('#btnAdmin').style.display='inline-block';
  $('#btnDep').style.display=state.crypto?'inline-block':'none';
  const prods=await api('products');
  state.products=prods.products||[];
  renderCats();renderProducts();
}
function renderLogin(){
  const botU = state.botUsername || null;
  $('#view').innerHTML=`<section class="login-wrap"><div class="login-brand"><div><div class="login-mark">🛒 ${t('app_name')}</div><h1>${state.lang==='tr'?'İhtiyacın olan dijital ürünler, tek yerde.':'Digital essentials, all in one place.'}</h1><p>${state.lang==='tr'?'Güvenli alışveriş, hızlı teslimat ve botunla ortak bakiye.':'Secure checkout, fast delivery and one balance shared with your bot.'}</p></div><div class="login-mark">${state.lang==='tr'?'Hızlı · Güvenli · Kolay':'Fast · Secure · Simple'}</div></div><div class="login-panel"><h2>${t('login_h')}</h2><p class="muted">${t('login_p')}</p><div id="telegramLogin"></div><div id="loginUnavailable" class="login-error" style="display:none"></div><div style="margin-top:18px"><button class="ghost" id="loginRetry">${t('login_retry')}</button></div></div></section>`;
  $('#loginRetry').onclick=()=>loadShell();
  if(!botU){
    $('#loginUnavailable').textContent=state.lang==='tr'?'Telegram giriş widget’ı için bot kullanıcı adı alınamadı. Sunucunun bot yapılandırmasını kontrol edin.':'Could not load the bot username for Telegram login. Check the bot configuration.';
    $('#loginUnavailable').style.display='block';
    return;
  }
  // Build the widget with DOM APIs. Never place a literal <script> inside an
  // inline script template: HTML parsing would terminate this script early.
  const widget=document.createElement('script');
  widget.async=true;widget.src='https://telegram.org/js/telegram-widget.js?22';
  widget.dataset.telegramLogin=botU;widget.dataset.size='large';
  widget.dataset.onauth='onTelegramAuth(user)';widget.dataset.requestAccess='write';
  $('#telegramLogin').appendChild(widget);
}
window.onTelegramAuth=async(user)=>{
  try{const r=await api('login',{method:'POST',body:JSON.stringify(user)});
    state.token=r.token;localStorage.setItem('shop_token',r.token);loadShell();
  }catch(e){toast(t('err_login')+': '+e.message)}
};

function renderCats(){
  const c=$('#cats');c.innerHTML='';
  const mk=(label,cat,on)=>{const b=document.createElement('div');b.className='chip'+(on?' on':'');b.textContent=label;b.onclick=()=>{state.cat=cat;renderCats();renderProducts()};return b};
  c.appendChild(mk(t('all'),null,state.cat===null));
  for(const cat of state.categories)c.appendChild(mk((cat.emoji||'📂')+' '+cat.name,cat.id,state.cat===cat.id));
}
function visibleProducts(){
  if(state.cat===null)return state.products;
  const cat=state.categories.find(c=>c.id===state.cat);
  const ids=new Set((cat&&cat.product_ids)||[]);
  return state.products.filter(p=>ids.has(p.id));
}
function renderProducts(){
  const list=visibleProducts();
  $('#view').innerHTML='<div class="grid">'+list.map(p=>{
    const badge=p.sold_out?`<span class="badge">${t('sold_out')}</span>`:
      (p.warranty==='guaranteed'?`<span class="badge warr">🛡</span>`:'');
     return `<div class="card" data-id="${p.id}"><h3>${esc(p.name)}</h3>
     <div class="row"><span class="price">${money(p.price)}</span><span>${badge}</span></div>
    <div class="stock">${t('stock')}: ${p.stock}</div></div>`}).join('')+'</div>';
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openProduct(+c.dataset.id));
}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

async function openProduct(id){
  $('#view').innerHTML='<p class="muted">…</p>';
  let d;try{d=await api('product/'+id)}catch(e){toast(e.message);return loadShell()}
  state.product=d;state.decision=null;state.lock=null;
   const p=d.product,s=d.summary;
   const reservationOnly=!!s.reservation_only;
  let svcHtml='';
  if(d.services&&d.services.length){
    svcHtml=`<h4 style="margin:14px 0 4px">${t('svc')}</h4>`+d.services.map(sv=>{
      const off=!sv.affordable;
       return `<div class="svc${off?' off':''}${sv.best?' sel':''}" data-ps="${sv.ps_id||''}" data-best="${sv.best?1:0}">
      <span class="n">#${sv.index} ${esc(sv.name)} ${sv.best?'⭐':''}${sv.warranty==='guaranteed'?' 🛡':sv.warranty==='instant'?' ⚡':''}</span>
       <span class="p">${off?(sv.reservation_only?('⏳ '+t('reserve')):('— '+(t('sold_out')))):money(sv.price)+(sv.stock!=null?` <small class="muted">(${t('stock')} ${sv.stock})</small>`:'')}</span></div>`}).join('');
  }
  const buyPrice=s.price;
  $('#view').innerHTML=`<button class="ghost" id="bBack">${t('back')}</button>
  <h2 style="margin:12px 0 4px">${esc(p.name)} ${p.warranty==='guaranteed'?'🛡':''}</h2>
  <div class="price" style="font-size:22px">${money(buyPrice)} ${s.sold_out?`<span class="badge">${t('sold_out')}</span>`:''}</div>
  ${p.description?`<div class="desc">${esc(p.description)}</div>`:''}${svcHtml}
   <div class="rowbtns"><button id="bBuy" ${''}>${s.sold_out||reservationOnly?t('reserve'):t('buy')}</button></div>
   ${reservationOnly&&!s.sold_out?`<p class="login-error">📦 Stok mevcut. Tedarikçi bakiyesi yenilenene kadar rezerve edilir; bakiye geldiğinde otomatik teslim edilir. Destek: <a href="https://t.me/MerhabaWorld" target="_blank" rel="noopener">@MerhabaWorld</a></p>`:''}`;
  $('#bBack').onclick=loadShell;
  let sel=d.services?d.services.find(x=>x.best)||d.services.find(x=>x.affordable):null;
   document.querySelectorAll('.svc').forEach(el=>el.onclick=()=>{
    document.querySelectorAll('.svc').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    sel={ps_id:+el.dataset.ps||null,best:el.dataset.best==='1',price:parseFloat(el.querySelector('.p').textContent)};
    const pr=el.querySelector('.p').textContent.match(/([\d.]+)\$/);
    if(pr){$('#bBuy').closest('main').querySelector('.price').innerHTML=el.querySelector('.p').textContent.split('<')[0];}
    state.decision=sel;});
   $('#bBuy').onclick=()=>openCheckout(sel, reservationOnly||s.sold_out);
}

async function openCheckout(sel, forceReserve=false){
   const d=state.product;const s=d.summary;
  let unit=s.price,lock=null;
   if(sel){ // dynamic service chosen -> lock it
    try{const r=await api('lock',{method:'POST',body:JSON.stringify({product_id:d.product.id,ps_id:sel.ps_id||undefined,best:!!sel.best})});
      lock=r.token;unit=r.unit;}catch(e){toast(e.message);return}}
  const sheet=$('#sheet');
  sheet.innerHTML=`<h3>${t('buy_t')}: ${esc(d.product.name)}</h3>
  <div class="muted">${t('svc')}: $${Number(unit).toFixed(2)}</div>
  <label>${t('qty')}</label><input id="inQty" type="number" min="1" value="1">
  <div class="muted" style="margin-top:8px">${t('total')}: <b id="tt">${money(unit)}</b></div>
  <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
    ${[1,5,10,20,50,100].map(q=>`<button class="ghost qb" data-q="${q}" style="padding:8px 12px">${q}</button>`).join('')}</div>
  <div class="rowbtns" style="margin-top:14px">
     <label style="display:flex;align-items:center;gap:8px;width:100%;font-size:14px"><input type="checkbox" id="bBuyReserveOn" style="width:auto"> ${t('reserve')}</label>
     <button id="payBal" ${state.me&&state.me.balance<unit?'disabled':''}>${t('pay_bal')} (${money(state.me?state.me.balance:0)})</button>
    <button class="ghost" id="payBn">${t('pay_bn')}</button>
    <button class="ghost" id="cancel">❌</button>
  </div>${state.me&&state.me.balance<0?`<p style="color:#e5484d;font-size:13px;margin:6px 0 0">⚠️ ${t('caride_note')}</p>`:''}<div id="bnBox" style="display:none"><label>TXID</label><input id="inTx" placeholder="işlem hash/id"><button id="bnGo" style="margin-top:8px">${t('pay')}</button></div>`;
  $('#modal').classList.add('on');
  const qtyEl=$('#inQty');
   const upd=()=>{$('#tt').textContent=money(Number(qtyEl.value||1)*unit);
     $('#payBal').disabled=state.me.balance<Number(qtyEl.value||1)*unit};
  qtyEl.oninput=upd;document.querySelectorAll('.qb').forEach(b=>b.onclick=()=>{qtyEl.value=b.dataset.q;upd()});upd();
  $('#cancel').onclick=closeModal;
  const pay=async(pmethod,extra)=>{
    const qty=Math.max(1,parseInt(qtyEl.value,10));
    const idem='w'+Date.now()+Math.random().toString(36).slice(2);
    const reserve=!!$('#bBuyReserveOn');
    try{
      const r=await api('checkout',{method:'POST',headers:{'idempotency-key':idem},
        body:JSON.stringify(Object.assign({product_id:d.product.id,qty,lock_token:lock,pay:pmethod,reserve},extra||{}))});
      closeModal();renderDelivered(r);
      state.me.balance=await api('me').then(m=>m.balance);setBal(state.me.balance);
    }catch(e){toast(e.message)}
  };
  $('#payBal').onclick=()=>pay('balance');
  $('#payBn').onclick=()=>{$('#bnBox').style.display='block'};
  $('#bnGo').onclick=()=>{const tx=$('#inTx').value.trim();if(!tx)return toast('TXID gir');pay('binance',{txid:tx})};
}
function closeModal(){$('#modal').classList.remove('on')}
function renderDelivered(r){
   if(r.kind==='queued'||r.kind==='topped_up'||r.kind==='reservation_pending'){
     const title=r.kind==='reservation_pending'?'⏳ Rezervasyon oluşturuldu':(r.kind==='queued'?t('queued_t'):t('credited_t'));
     $('#view').innerHTML=`<h2>${title}</h2><div class="order"><p style="margin:0">${esc(r.message||'')}</p></div>
    <div class="rowbtns"><button class="ghost" onclick="loadShell()">${t('back')}</button></div>`;
    return;
  }
  const items=(r.delivered||[]).map(x=>`<div class="order"><code>${esc(x)}</code></div>`).join('');
  $('#view').innerHTML=`<h2>✅ ${t('ok')}</h2><div class="muted">${r.qty} × — ${money(r.paid)}</div>
  ${r.kind==='reservation'?`<div class="order">${t('pend')}</div>`:items}
  <div class="rowbtns"><button class="ghost" onclick="loadShell()">${t('back')}</button></div>`;
}

async function renderOrders(){
  $('#view').innerHTML='<p class="muted">…</p>';
  const d=await api('orders');
  const os=d.orders.map(o=>`<div class="order"><div class="hd"><b>${esc(o.product)}</b><span class="st ok">${o.status==='delivered'?t('delivered'):o.status}</span></div>
   <div class="muted">#${o.id} · ${o.qty} × · ${money(o.paid)} · ${o.date||''}</div>
   ${(o.delivered||[]).map(x=>`<div><code>${esc(x)}</code></div>`).join('')}</div>`).join('');
  const rs=d.reservations.map(o=>`<div class="order"><div class="hd"><b>${esc(o.product)}</b><span class="st pend">${t('pend')} ${o.fulfilled}/${o.qty}</span></div>
   <div class="muted">#${o.id} · ${o.qty} × · ${money(o.paid)}</div></div>`).join('');
  $('#view').innerHTML=`<h2>${t('orders_t')}</h2>${os}${rs}${(!os&&!rs)?`<p class="muted">${t('no_orders')}</p>`:''}
  <div class="sheet" style="margin-top:16px"><h3>${t('promo_h')}</h3>
   <div style="display:flex;gap:8px"><input id="inPromo" placeholder="${t('promo_ph')}" style="flex:1"><button id="btnPromo" style="width:auto">${t('promo_btn')}</button></div>
   <p class="muted" id="promoMsg" style="margin-top:8px"></p></div>
  <div class="rowbtns"><button class="ghost" onclick="loadShell()">${t('back')}</button></div>`;
  $('#btnPromo').onclick=async()=>{
    const code=$('#inPromo').value.trim(); if(!code)return;
    try{const r=await api('promo',{method:'POST',body:JSON.stringify({code})});
      $('#promoMsg').textContent=r.message;
      if(r.ok){state.me.balance=r.balance;setBal(r.balance);}
    }catch(e){$('#promoMsg').textContent=e.message}
  };
}
$('#btnOrders').onclick=renderOrders;
$('#btnDep').onclick=renderDeposits;
async function renderDeposits(){
  $('#view').innerHTML='<p class="muted">…</p>';
  let d;try{d=await api('deposits')}catch(e){toast(e.message);return loadShell()}
  if(!d.enabled){$('#view').innerHTML=`<p class="muted">devre dışı</p>`;return}
  const have={};(d.data||[]).forEach(w=>have[w.network]=w);
  $('#view').innerHTML=`<h2>🌐 ${t('dep_t')}</h2>`+(d.networks||[]).map(n=>{
    const w=have[n.key];
    return `<div class="order"><div class="hd"><b>${n.icon} ${esc(n.label)}</b></div>`
     +(w
       ? `<div><code style="user-select:all">${esc(w.address||'—')}</code></div>`
         +(w.memo?`<div class="muted">Memo / Payment ID: <code style="user-select:all">${esc(w.memo)}</code></div>`:'')
         +(w.url?`<div class="muted"><a href="${esc(w.url)}" target="_blank" rel="noopener">🔗 ödeme sayfası</a></div>`:'')
         +`<div class="rowbtns"><button class="ghost" onclick="depCopy('${n.key}')">${t('copied')}</button></div>`
       : `<div class="rowbtns"><button class="ghost" onclick="depGet('${n.key}')">${t('dep_get')}</button></div>`)
     +`</div>`;
  }).join('')+`<p class="muted">${t('dep_note')}</p><div class="rowbtns"><button class="ghost" onclick="loadShell()">${t('back')}</button></div>`;
  state.depCache={};(d.data||[]).forEach(w=>state.depCache[w.network]=w);
}
function depCopy(k){const w=state.depCache&&state.depCache[k];if(w&&w.address&&navigator.clipboard)navigator.clipboard.writeText(w.address+(w.memo?' '+w.memo:'')).then(()=>toast(t('copied')))}
function depGet(k){api('deposits',{method:'POST',body:JSON.stringify({network:k})}).then(()=>{renderDeposits();toast('✅')}).catch(e=>toast(e.message))}
$('#btnOut').onclick=async()=>{try{await api('logout',{method:'POST'})}catch(e){};localStorage.removeItem('shop_token');state.token=null;renderLogin()};
$('#btnLang').onclick=()=>{state.lang=state.lang==='tr'?'en':'tr';localStorage.setItem('shop_lang',state.lang);$('#btnLang').textContent=state.lang==='tr'?'EN/TR':'TR/EN';loadShell()};
loadShell();
</script>
</body>
</html>
